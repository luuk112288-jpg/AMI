name: Publish verified AMI 0.3.0
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/release-0.3.0.yml"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: luuk112288-jpg/AMI
    steps:
      - name: Verify tested source and download the exact APK artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/luuk112288-jpg/AMI/actions/runs/39279442544 > run.json
          python3 - <<'PY'
          import json
          run = json.load(open("run.json"))
          assert run["conclusion"] in (None, "success"), "Source run failed"
          assert run["head_sha"] == "fc6ff02e4e05a6ab0baaebeb339977e7b97eab37", "Wrong source"
          PY
          gh api repos/luuk112288-jpg/AMI/actions/runs/39279442544/jobs > jobs.json
          python3 - <<'PY'
          import json
          jobs = {j["name"]: j for j in json.load(open("jobs.json"))["jobs"]}
          assert jobs["device"]["conclusion"] == "success", "Android tests did not pass"
          for name in ("Run gradle :app:testDebugUnitTest :app:assembleDebug", "Run actions/upload-artifact@v4"):
              assert any(s["name"] == name and s["conclusion"] == "success" for s in jobs["apk"]["steps"]), name
          PY
          gh api repos/luuk112288-jpg/AMI/actions/artifacts/12199136959/zip > artifact.zip
          echo '5f11431398399e2639551f7829ba0d6e62551e6df86f0b7e67ba6eedd1302f51  artifact.zip' | sha256sum --check
          unzip -q artifact.zip -d extracted
          mkdir release
          cp extracted/app-debug.apk release/AMI-0.3.0.apk
      - name: Check Android package version
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging release/AMI-0.3.0.apk > package.txt
          python3 - <<'PY'
          text = open("package.txt").read()
          assert "name='com.ami.music'" in text, "Unexpected Android package"
          assert "versionCode='3'" in text, "Old APK version code"
          assert "versionName='0.3.0'" in text, "Old APK version"
          assert "android.permission.READ_MEDIA_AUDIO" in text, "Phone music permission missing"
          print(text.splitlines()[0])
          PY
          cd release
          sha256sum AMI-0.3.0.apk > SHA256SUMS.txt
      - name: Publish APK under Releases
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          ## AMI 0.3.0 — Artificial Music Intelligence

          Download **AMI-0.3.0.apk** hieronder en open het op je Android-telefoon. Deze download is de losse APK; uitpakken is niet nodig.

          ### Nieuw
          - **Search → Online**: zoek echte Audius-nummers en ontdek trending muziek.
          - Speel openbare Audius-tracks rechtstreeks af in AMI, zonder Spotify-app of Spotify-advertenties.
          - Online hoezen, bronvermelding, likes, gemengde playlists, wachtrij en achtergrondspeler.
          - Alleen openbaar afspeelbare tracks; betaalde, afgeschermde en niet-beschikbare tracks worden overgeslagen.
          - Je lokale muziekscan en bestaande bibliotheek blijven beschikbaar.

          APK-build en unit-tests geslaagd. Alle **25 Android-tests** geslaagd, inclusief echte Audius-streaming op Android en herstel van de online-weergave.
          Bron: fc6ff02e4e05a6ab0baaebeb339977e7b97eab37.
          De APK is exact overgenomen uit de geteste build, niet opnieuw gebouwd.

          Audius heeft zijn eigen catalogus; dit is geen Spotify-catalogus. Online zoeken, hoezen en afspelen gebruiken internetdata en verbindingen met Audius/contentnodes. AMI voegt geen advertenties toe.

          Dit is een development-signed testversie voor Android 8+. Een oudere test-APK kan een andere ondertekening hebben. Als Android een handtekeningconflict meldt, kan installatie naast/over die oude versie niet; verwijderen van de oude app wist AMI-playlists en privé-imports. De oorspronkelijke gescande muziekbestanden blijven behouden.
          NOTES
          gh release create v0.3.0 release/AMI-0.3.0.apk release/SHA256SUMS.txt --repo luuk112288-jpg/AMI --target fc6ff02e4e05a6ab0baaebeb339977e7b97eab37 --title 'AMI 0.3.0 — Artificial Music Intelligence' --notes-file notes.md --latest
